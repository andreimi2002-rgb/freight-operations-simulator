<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1017" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238ce0bd'/%3E%3Cpath d='M6 10h11v9H6zM17 13h4l4 3.5V19H17z' fill='none' stroke='%23092017' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <title>Freight Ops</title>
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/src/styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" integrity="sha384-MinO0mNliZ3vwppuPOUnGa+iq619pfMhLVUXfC4LHwSCvF9H+6P/KO4Q7qBOYV5V" crossorigin="anonymous" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h11v9H2z"/><path d="M13 9h4l4 3.5V15h-8z"/><circle cx="6" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg></span>
        <span><span class="brandname" data-i18n="brand.name"></span><span class="brandline" data-i18n="brand.tagline"></span></span>
      </a>
      <nav class="quick" id="recent" data-i18n-aria-label="topbar.recent"></nav>
      <div class="top-actions">
        <button type="button" class="searchbtn" id="searchBtn" data-i18n-aria-label="topbar.searchAria">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span class="searchbtn-text" data-i18n="topbar.search"></span><kbd>Ctrl K</kbd>
        </button>
        <button type="button" class="ghost" id="newLoadBtn" data-i18n="topbar.newLoad"></button>
        <button type="button" class="ghost" id="aboutBtn" data-i18n="topbar.about"></button>
        <button type="button" class="primary" id="generateBtn" data-i18n="topbar.generate"></button>
      </div>
    </div>
  </header>

  <main class="app" id="main">
    <section id="hero"></section>
    <div id="results" hidden>
      <div class="tabbar-wrap">
        <div class="tabbar" id="tabbar" role="tablist" data-i18n-aria-label="tab.listLabel"></div>
        <button type="button" class="ghost" id="printBtn" data-i18n="print.button"></button>
      </div>
      <div id="panels"></div>
      <div id="mapStash" hidden>
        <section class="card map-card" id="mapCard" data-i18n-aria-label="map.title">
          <div class="map" id="routeMap"></div>
          <div class="map-overlay eyebrow" data-i18n="map.title"></div>
          <div class="map-status" id="mapStatus" role="status"></div>
          <div class="map-attrib" data-i18n="map.attribution"></div>
        </section>
      </div>
    </div>

    <footer class="footer">
      <span data-i18n="footer.left"></span>
      <span data-i18n="footer.sources"></span>
      <span><span data-i18n="footer.independent"></span> <span id="versionLabel"></span></span>
    </footer>
  </main>
</div>

<!-- Row detail drawer -->
<div class="drawer-backdrop" id="detailLayer" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
  <aside class="drawer">
    <div class="drawer-bar">
      <button type="button" class="iconbtn" data-close data-i18n-aria-label="drawer.close">×</button>
      <span class="eyebrow" id="detailTitle" data-i18n="drawer.details"></span>
      <span class="badge" id="detailBadge"></span>
    </div>
    <div class="drawer-body" id="detailBody"></div>
  </aside>
</div>

<!-- New load drawer -->
<div class="drawer-backdrop" id="generatorLayer" role="dialog" aria-modal="true" aria-labelledby="generatorTitle">
  <aside class="drawer drawer-narrow">
    <div class="drawer-bar">
      <button type="button" class="iconbtn" data-close data-i18n-aria-label="gen.close">×</button>
      <span class="eyebrow" id="generatorTitle" data-i18n="gen.title"></span>
      <span></span>
    </div>
    <div class="drawer-body" id="generatorBody"></div>
  </aside>
</div>

<!-- About the data drawer -->
<div class="drawer-backdrop" id="aboutLayer" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
  <aside class="drawer">
    <div class="drawer-bar">
      <button type="button" class="iconbtn" data-close data-i18n-aria-label="about.close">×</button>
      <span class="eyebrow" id="aboutTitle" data-i18n="about.title"></span>
      <span></span>
    </div>
    <div class="drawer-body" id="aboutBody"></div>
  </aside>
</div>

<!-- City search palette -->
<div class="modal-backdrop" id="paletteLayer" role="dialog" aria-modal="true" aria-labelledby="paletteTitle">
  <div class="modal">
    <h2 class="sr-only" id="paletteTitle" data-i18n="topbar.search"></h2>
    <div class="palette-input">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="modal-search" id="paletteInput" type="search" autocomplete="off" spellcheck="false" data-i18n-aria-label="topbar.searchAria" aria-controls="paletteList" />
      <button type="button" class="kbd-btn" data-close data-i18n-aria-label="palette.close">esc</button>
    </div>
    <div class="palette-mode" id="paletteMode"></div>
    <div class="palette-list" id="paletteList" role="listbox" data-i18n-aria-label="palette.listLabel"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<section class="print-only" id="printSheet" aria-hidden="true"></section>
</body>
</html>
