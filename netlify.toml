# Freight World (production: main).
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  ASTRO_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Job sheets: one static page reads the job id from the path.
[[redirects]]
  from = "/ats/mission/*"
  to = "/ats/mission/index.html"
  status = 200
